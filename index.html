<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>돈워리정 30 DAYS</title>
<style>
:root {
  --ink:#0f0f10;
  --muted:#777;
  --line:#e8e8e8;
  --paper:#fff;
  --outer:#f3f4f6;
  --plan:#a778f0;
  --impulse:#ff781b;
  --external:#58d8c5;
  --check:#f4cf39;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:var(--outer);color:var(--ink)}
button{font:inherit}
.screen{display:none;min-height:100vh}
.screen.active{display:flex}
.frame{
  width:min(1180px,94vw);
  min-height:min(880px,92vh);
  margin:auto;
  background:#fff;
  border-radius:34px;
  box-shadow:0 24px 80px rgba(34,44,70,.10);
  position:relative;
  overflow:hidden;
}
.chrome{position:absolute;top:28px;left:34px;display:flex;gap:10px;z-index:10}
.chrome i{width:12px;height:12px;border-radius:50%;background:#cfd2d8;display:block}
/* ---------- HOME ---------- */
#home{align-items:center;justify-content:center;padding:28px 0}
.hero{height:100%;min-height:min(880px,92vh);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:70px 34px 28px}
.hero-scene{position:relative;width:min(1040px,92vw);height:585px;max-height:68vh;margin-top:-4px}
.big-capsule{display:none!important;}
.characters{position:absolute;inset:0;z-index:3}
.char{
  position:absolute;border:0;background:transparent;padding:0;cursor:pointer;outline:none;
  transition:transform .24s ease, filter .24s ease, opacity .24s ease;
}
.char img{display:block;width:100%;pointer-events:none;user-select:none}
.char.plan{width:27%;left:6%;bottom:3%}
.char.impulse{width:31%;left:28%;bottom:0}
.char.external{width:27%;left:55%;bottom:5%}
.char.check{width:25%;right:3%;bottom:0}
.characters:has(.char:hover) .char:not(:hover){opacity:.52;filter:saturate(.72)}
.char:hover,.char:focus-visible{transform:translateY(-10px) scale(1.045);filter:drop-shadow(0 20px 20px rgba(0,0,0,.12));z-index:9}
.start{margin-top:26px;z-index:11}
.start button{
  min-width:240px;border:0;border-radius:999px;background:#111;color:#fff;
  padding:17px 28px;font-weight:800;font-size:18px;cursor:pointer;
  box-shadow:0 14px 30px rgba(0,0,0,.17);transition:.18s;
}
.start button:hover{transform:translateY(-2px) scale(1.01)}
.start button span{display:inline-block;margin-left:28px;font-size:22px}
.tooltip{
  position:fixed;z-index:99;width:305px;background:rgba(255,255,255,.96);
  border:1px solid rgba(15,15,16,.15);border-radius:20px;padding:17px 18px;
  box-shadow:0 18px 55px rgba(0,0,0,.13);backdrop-filter:blur(12px);
  opacity:0;pointer-events:none;transform:translateY(8px);transition:.15s;
}
.tooltip.show{opacity:1;transform:none}
.tooltip-top{display:flex;align-items:center;gap:9px}
.tooltip-dot{width:11px;height:11px;border-radius:50%}
.tooltip h3{font-size:26px;margin:0;letter-spacing:-.05em}
.tooltip .type{font-size:12px;color:#777;margin-top:3px}
.tooltip p{font-size:14px;line-height:1.55;color:#3c3c3c;margin:10px 0 0}
/* ---------- QUIZ ---------- */
#quiz{background:#fff;flex-direction:column}
.quiz-top{height:78px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:0 34px;position:sticky;top:0;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);z-index:10}
.quiz-back{border:0;background:transparent;font-size:24px;cursor:pointer}
.progress-track{flex:1;height:6px;background:#f0f0f0;border-radius:999px;overflow:hidden}
.progress-fill{height:100%;width:0;background:#111;border-radius:999px;transition:width .35s}
.count{font-size:13px;color:#666;min-width:60px;text-align:right}
.quiz-body{flex:1;display:flex;align-items:center;justify-content:center;padding:50px 22px}
.qbox{width:min(760px,100%)}
.qnum{font-size:13px;color:#8a8a8a;margin-bottom:18px}
.qtext{font-size:clamp(30px,4vw,48px);line-height:1.25;letter-spacing:-.045em;margin:0 0 48px;font-weight:800}
.scale-labels{display:flex;justify-content:space-between;color:#888;font-size:12px;margin:0 4px 10px}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.scale button{height:72px;border:1px solid #ddd;background:#fff;border-radius:20px;font-size:20px;font-weight:900;cursor:pointer;transition:.15s}
.scale button:hover{border-color:#111;transform:translateY(-2px)}
.scale button.selected{background:#111;color:#fff;border-color:#111}
.nav{display:flex;align-items:center;gap:10px;margin-top:34px}
.nav .spacer{flex:1}
.nav button{border-radius:999px;padding:13px 21px;font-weight:800;cursor:pointer}
.prev{border:1px solid #ddd;background:#fff}
.next{border:1px solid #111;background:#fff}
.result-btn{display:none;border:1px solid #111;background:#111;color:#fff}
.result-btn.show{display:inline-block}
/* ---------- LOADING ---------- */
#loading{background:#fff;align-items:center;justify-content:center}
.loading-box{text-align:center}
.loader-capsule{
  width:136px;
  height:64px;
  margin:0 auto 30px;
  animation:tilt 1.05s ease-in-out infinite;
  transform-origin:center;
  perspective:700px;
}
.loader-pill{
  position:relative;
  width:100%;
  height:100%;
  border-radius:999px;
  overflow:hidden;
  transform:rotateX(8deg);
  background:linear-gradient(180deg,#fbfcff 0%,#eef1f6 52%,#dfe4ec 100%);
  box-shadow:
    0 18px 30px rgba(36,49,70,.16),
    0 5px 10px rgba(36,49,70,.10),
    inset 0 2px 4px rgba(255,255,255,.95),
    inset 0 -6px 10px rgba(97,111,132,.10);
}
.loader-pill::before{
  content:"";
  position:absolute;
  left:0;top:0;bottom:0;width:50.5%;
  border-radius:999px 0 0 999px;
  background:linear-gradient(145deg,#ffffff 0%,#f6f7fa 42%,#e6e9ef 78%,#d7dce5 100%);
  box-shadow:inset -2px 0 4px rgba(74,86,105,.08);
}
.loader-pill::after{
  content:"";
  position:absolute;
  right:0;top:0;bottom:0;width:50.5%;
  border-radius:0 999px 999px 0;
  background:linear-gradient(145deg,#ffcf67 0%,#ff9f55 38%,#ff7d75 68%,#e95da6 100%);
  box-shadow:
    inset 4px 3px 7px rgba(255,255,255,.27),
    inset -5px -5px 10px rgba(128,38,85,.12);
}
.loader-pill .shine{
  position:absolute;
  left:12px;right:13px;top:8px;height:20px;
  border-radius:999px;
  background:linear-gradient(180deg,rgba(255,255,255,.86),rgba(255,255,255,.16) 65%,rgba(255,255,255,0));
  z-index:4;
  pointer-events:none;
}
.loader-pill .core{
  position:absolute;
  left:50%;top:6px;bottom:6px;width:2px;
  transform:translateX(-50%);
  background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(87,98,116,.10),rgba(255,255,255,.45));
  box-shadow:-1px 0 2px rgba(0,0,0,.04),1px 0 2px rgba(255,255,255,.38);
  z-index:5;
}
@keyframes tilt{0%,100%{transform:rotate(-8deg) translateY(0)}50%{transform:rotate(8deg) translateY(-4px)}}
.loading-title{font-size:29px;font-weight:900;letter-spacing:-.035em;margin:0 0 18px}
.dots{display:flex;justify-content:center;gap:9px}
.dots i{width:9px;height:9px;border-radius:50%;background:#d7d7d7;animation:dot 1.1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.17s}
.dots i:nth-child(3){animation-delay:.34s}
@keyframes dot{0%,60%,100%{background:#d7d7d7;transform:translateY(0)}30%{background:#ff8f66;transform:translateY(-5px)}}
/* ---------- RESULT ---------- */
#result{background:#fff;align-items:center;justify-content:center}
.result-wrap{width:min(1120px,92vw);padding:44px 0 60px}
.result-header{display:flex;justify-content:flex-end;gap:10px;margin-bottom:4px}
.restart{border:1px solid #ddd;background:#fff;border-radius:999px;padding:10px 17px;font-weight:700;cursor:pointer}
.result-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:56px;align-items:center;min-height:660px}
.result-character{display:flex;align-items:center;justify-content:center;min-height:520px}
.result-character img{width:min(430px,100%);max-height:520px;object-fit:contain;filter:drop-shadow(0 24px 36px rgba(0,0,0,.10));animation:pop .55s cubic-bezier(.2,.85,.22,1)}
@keyframes pop{0%{opacity:0;transform:translateY(20px) scale(.94)}100%{opacity:1;transform:none}}
.kicker{font-size:11px;letter-spacing:.16em;font-weight:900;color:#777}
.result-title{font-size:clamp(34px,4.3vw,58px);line-height:1;letter-spacing:-.055em;margin:8px 0 12px;white-space:nowrap}
.result-desc{font-size:17px;line-height:1.65;color:#555;margin:0 0 30px}
.gauges{display:grid;gap:18px}
.gauge-row{display:grid;grid-template-columns:112px 1fr 62px;gap:14px;align-items:center}
.gauge-name{font-weight:800;font-size:14px}
.track{height:19px;border-radius:999px;background:#f0f0f0;overflow:hidden}
.fill{height:100%;width:0;border-radius:999px;transition:width 1.2s cubic-bezier(.17,.8,.2,1)}
.score{font-weight:900;text-align:right}
.level{grid-column:2/4;font-size:11px;color:#777;margin-top:-10px}
.secondary{margin-top:26px;padding:16px 18px;border-radius:18px;background:#f7f7f7;font-size:13px;line-height:1.55;color:#444;display:none}
.secondary.show{display:block}
.rx{margin-top:16px;border:1px solid #111;border-radius:22px;padding:20px 22px}
.rx small{display:block;font-size:10px;letter-spacing:.13em;font-weight:900;margin-bottom:7px}
.rx strong{display:block;font-size:22px;margin-bottom:6px}
.rx p{font-size:14px;line-height:1.55;color:#555;margin:0}
.note{font-size:10px;color:#aaa;line-height:1.5;margin-top:14px}
@media(max-width:820px){
  .frame{width:96vw;min-height:94vh;border-radius:26px}
  .hero-scene{height:540px}
  .char.plan{width:29%;left:2%} .char.impulse{width:33%;left:25%}
  .char.external{width:29%;left:53%} .char.check{width:27%;right:0}
  .result-grid{grid-template-columns:1fr;gap:12px}
  .result-character{min-height:280px}
  .result-character img{max-height:310px}
}
@media(max-width:560px){
  body{background:#fff}
  .frame{width:100%;min-height:100vh;border-radius:0;box-shadow:none}
  .hero{padding:44px 8px 24px}
  .hero-scene{height:480px;width:100%}
  .big-capsule{display:none!important;}
.char.plan{width:35%;left:-3%;bottom:9%}
  .char.impulse{width:38%;left:20%;bottom:5%}
  .char.external{width:33%;left:50%;bottom:10%}
  .char.check{width:31%;right:-4%;bottom:7%}
  .tooltip{width:250px}
  .start button{min-width:210px}
  .scale{gap:7px} .scale button{height:60px}
  .qtext{font-size:30px}
}

/* ---------- FLOATING PILL PARTICLES ---------- */
.pill-particles{
  position:absolute;
  inset:0;
  overflow:hidden;
  pointer-events:none;
  z-index:0;
}
.pill-particle{
  position:absolute;
  width:44px;
  height:21px;
  border-radius:999px;
  opacity:.42;
  filter:blur(.1px);
  box-shadow:0 7px 16px rgba(0,0,0,.06);
  animation:floatPill var(--dur,8s) ease-in-out infinite alternate;
  transform:rotate(var(--rot,0deg));
}
.pill-particle::before,
.pill-particle::after{
  content:"";
  position:absolute;
  top:0;
  bottom:0;
  width:50%;
}
.pill-particle::before{
  left:0;
  border-radius:999px 0 0 999px;
  background:rgba(255,255,255,.95);
}
.pill-particle::after{
  right:0;
  border-radius:0 999px 999px 0;
  background:var(--c,#7aa7ff);
}
@keyframes floatPill{
  0%{
    transform:translate3d(0,0,0) rotate(var(--rot,0deg));
  }
  50%{
    transform:translate3d(var(--dx,14px),-18px,0) rotate(calc(var(--rot,0deg) + 8deg));
  }
  100%{
    transform:translate3d(calc(var(--dx,14px) * -0.5),12px,0) rotate(calc(var(--rot,0deg) - 6deg));
  }
}
.pill-particle.small{width:30px;height:14px;opacity:.32}
.pill-particle.large{width:58px;height:28px;opacity:.28}

#home .frame > .hero,
#home .chrome{
  position:relative;
  z-index:2;
}


/* stronger pill readability on white background */
.pill-particle{
  border:1px solid rgba(22,22,22,.09);
  box-shadow:
    0 9px 18px rgba(28,36,52,.12),
    inset 0 1px 0 rgba(255,255,255,.95);
  opacity:.62;
}
.pill-particle::before{
  background:linear-gradient(180deg,#ffffff 0%,#f4f5f7 100%);
  box-shadow:
    inset -1px 0 0 rgba(22,22,22,.06),
    inset 0 1px 0 rgba(255,255,255,1);
}
.pill-particle::after{
  box-shadow:inset 1px 0 0 rgba(255,255,255,.28);
}
.pill-particle.small{opacity:.50}
.pill-particle.large{opacity:.48}


/* ===== FINAL OVERRIDES: true fullscreen + clearer floating pills ===== */

/* Remove the mock browser/card frame completely */
html, body{
  width:100%;
  min-height:100%;
  background:#fff !important;
}
#home{
  width:100vw;
  min-height:100vh;
  padding:0 !important;
  margin:0 !important;
  background:#fff !important;
}
#home .frame{
  width:100vw !important;
  min-width:100vw !important;
  height:100vh !important;
  min-height:100vh !important;
  margin:0 !important;
  border-radius:0 !important;
  box-shadow:none !important;
  overflow:hidden !important;
  background:#fff !important;
}
#home .chrome{
  display:none !important;
}
#home .hero{
  width:100vw !important;
  min-height:100vh !important;
  height:100vh !important;
  padding:24px 32px 26px !important;
  justify-content:center !important;
  background:#fff !important;
}

/* Keep characters visually centered on the full monitor */
#home .character-stage{
  width:min(1120px,94vw) !important;
  height:min(610px,72vh) !important;
  margin:0 auto !important;
}

/* Make floating pills legible against white */
.pill-particles{
  z-index:1 !important;
}
.pill-particle{
  opacity:.86 !important;
  border:1.5px solid rgba(32,36,44,.18) !important;
  box-shadow:
    0 8px 14px rgba(22,28,38,.17),
    0 2px 5px rgba(22,28,38,.11),
    inset 0 1px 0 rgba(255,255,255,1) !important;
  filter:none !important;
}
.pill-particle::before{
  background:linear-gradient(180deg,#ffffff 0%,#eeeeef 100%) !important;
  box-shadow:
    inset -1px 0 0 rgba(20,24,30,.10),
    inset 0 1px 0 rgba(255,255,255,1) !important;
}
.pill-particle::after{
  box-shadow:
    inset 1px 0 0 rgba(255,255,255,.35),
    inset 0 -1px 0 rgba(0,0,0,.06) !important;
}
.pill-particle.small{
  opacity:.72 !important;
}
.pill-particle.large{
  opacity:.72 !important;
}

/* A few particles slightly larger so the white half reads clearly from a distance */
.pill-particle:nth-child(1),
.pill-particle:nth-child(4),
.pill-particle:nth-child(7),
.pill-particle:nth-child(10){
  transform:scale(1.14) rotate(var(--rot,0deg));
}

/* Ensure hero content sits above the particle layer */
#home .hero,
#home .character-stage,
#home .hero-actions{
  position:relative;
  z-index:3 !important;
}

/* Mobile/tablet: still true fullscreen */
@media(max-width:820px){
  #home .frame,
  #home .hero{
    width:100vw !important;
    height:100vh !important;
    min-height:100vh !important;
    border-radius:0 !important;
  }
  #home .hero{
    padding:18px 12px 22px !important;
  }
}


/* ===== HOTFIX: visible particles + larger characters ===== */

/* The white hero layer was covering the particles. Keep the full-screen white
   on the frame, but make the hero itself transparent. */
#home .frame{
  background:#fff !important;
}
#home .hero{
  background:transparent !important;
}

/* particles sit above the white background, below the characters */

  z-index:2 !important;
  display:block !important;

  opacity:1 !important;
}
#home .hero,
#home .character-stage,
#home .hero-actions{
  z-index:3 !important;
}

/* Make pills noticeably visible on a white exhibition monitor */

}

}

}

}

@media(max-width:900px){
  #home .character.plan{width:29vw !important;left:0 !important}
  #home .character.impulse{width:31vw !important;left:22% !important}
  #home .character.external{width:29vw !important;left:49% !important}
  #home .character.check{width:27vw !important;right:-1% !important}
}



/* ===== v5 adjustments: 3D pills + slightly larger characters + top logo ===== */
#home .hero{
  padding:34px 34px 24px !important;
}
#home .hero-logo{
  width:min(480px,42vw);
  margin:4px auto 10px;
  position:relative;
  z-index:4;
}
#home .hero-logo img{
  display:block;

  margin-top:2px !important;
  height:560px !important;
}

/* Slight character size bump */
#home .char.plan{width:29% !important;left:4% !important;bottom:1% !important}
#home .char.impulse{width:33% !important;left:26% !important;bottom:-1% !important}
#home .char.external{width:29% !important;left:54% !important;bottom:3% !important}
#home .char.check{width:27% !important;right:1% !important;bottom:-1% !important}

/* Make floating capsule particles look less flat and more 3D */
#home .pill-particle{
  width:54px !important;
  height:26px !important;
  opacity:.98 !important;
  border:none !important;
  border-radius:999px !important;
  background:transparent !important;
  box-shadow:none !important;
  filter:drop-shadow(0 10px 16px rgba(27,35,50,.18));
}
#home .pill-particle.small{width:38px !important;height:18px !important;opacity:.92 !important}
#home .pill-particle.large{width:66px !important;height:32px !important;opacity:.9 !important}
#home .pill-particle::before,
#home .pill-particle::after{
  top:0 !important;
  height:100% !important;
  border:none !important;
}
#home .pill-particle::before{
  left:0 !important;

  background:linear-gradient(145deg,#ffffff 0%,#f8f8fa 38%,#ededf1 68%,#e1e3e8 100%) !important;
  box-shadow:
    inset 2px 2px 4px rgba(255,255,255,.95),

  right:0 !important;
  left:auto !important;
  width:50% !important;

  background:linear-gradient(145deg,
    color-mix(in srgb, var(--c) 82%, white) 0%,
    color-mix(in srgb, var(--c) 96%, white) 24%,
    var(--c) 62%,
    color-mix(in srgb, var(--c) 82%, black) 100%) !important;
  box-shadow:

    inset -5px -3px 7px rgba(0,0,0,.10);
}

@media (max-width: 900px){
  #home .hero{padding:24px 8px 22px !important}
  #home .hero-logo{width:min(420px,72vw);margin-bottom:6px}
  #home .hero-scene{height:460px !important}
  #home .char.plan{width:31% !important;left:0 !important}
  #home .char.impulse{width:35% !important;left:22% !important}
  #home .char.external{width:31% !important;left:48% !important}
  #home .char.check{width:29% !important;right:-1% !important}
}


/* ===== v6 tuning: calmer pills, larger logo/characters, logo tucked behind ===== */

/* calmer floating motion */
@keyframes floatPill{
  0%{
    transform:translate3d(0,0,0) rotate(var(--rot,0deg));
  }
  50%{
    transform:translate3d(4px,-6px,0) rotate(calc(var(--rot,0deg) + 2deg));
  }
  100%{
    transform:translate3d(-3px,4px,0) rotate(calc(var(--rot,0deg) - 2deg));
  }
}

/* establish layering */
#home .hero{
  position:relative !important;
  z-index:3 !important;
  overflow:visible !important;
}

/* logo larger, lowered, behind the characters */
#home .hero-logo{
  position:absolute !important;
  top:13.5% !important;
  left:50% !important;
  transform:translateX(-50%) !important;
  width:min(680px,56vw) !important;
  margin:0 !important;
  z-index:2 !important;
  pointer-events:none !important;
}
#home .hero-logo img{
  width:100% !important;
  height:auto !important;
  display:block !important;
  filter:drop-shadow(0 10px 20px rgba(0,0,0,.055)) !important;
}

/* scene comes forward so characters overlap lower part of logo */
#home .hero-scene{
  position:relative !important;
  z-index:4 !important;
  width:min(1180px,96vw) !important;
  height:610px !important;
  margin-top:66px !important;
}

/* larger characters */
#home .char.plan{
  width:32% !important;
  left:1.5% !important;
  bottom:0 !important;
}
#home .char.impulse{
  width:36% !important;
  left:23% !important;
  bottom:-2.5% !important;
}
#home .char.external{
  width:32% !important;
  left:50.5% !important;
  bottom:1% !important;
}
#home .char.check{
  width:30% !important;
  right:-1% !important;
  bottom:-2% !important;
}

/* keep CTA comfortably below larger characters */
#home .start{
  position:relative !important;
  z-index:6 !important;
  margin-top:18px !important;
  transform:translateY(14px) !important;
}

/* pill layer stays subtle and behind everything */
#home .pill-particles{
  z-index:1 !important;
}
#home .pill-particle{
  animation-duration:var(--dur,9s) !important;
}

@media(max-width:900px){
  #home .hero-logo{
    top:14% !important;
    width:min(610px,72vw) !important;
  }
  #home .hero-scene{
    width:98vw !important;
    height:500px !important;
    margin-top:58px !important;
  }
  #home .char.plan{width:33% !important;left:-1% !important}
  #home .char.impulse{width:37% !important;left:21% !important}
  #home .char.external{width:33% !important;left:49% !important}
  #home .char.check{width:31% !important;right:-2% !important}
}

@media(max-width:560px){
  #home .hero-logo{
    top:15% !important;
    width:84vw !important;
  }
  #home .hero-scene{
    height:460px !important;
    margin-top:70px !important;
  }
}


@media(max-width:760px){
  .result-title{font-size:clamp(30px,8vw,46px);white-space:normal}
}

일 동안 단계적으로 연습합니다."}
};
const screens={home:document.getElementById("home"),quiz:document.getElementById("quiz"),loading:document.getElementById("loading"),result:document.getElementById("result")};
function go(name){Object.values(screens).forEach(s=>s.classList.remove("active"));screens[name].classList.add("active");window.scrollTo(0,0)}

// hover profile
const tooltip=document.getElementById("tooltip");
document.querySelectorAll(".char").forEach(el=>{
  const show=()=>{
    const d=META[el.dataset.key],r=el.getBoundingClientRect();
    tooltip.innerHTML=`<div class="tooltip-top"><span class="tooltip-dot" style="background:${d.color}"></span><h3>${d.name}</h3></div><div class="type">${d.type}</div><p>${d.intro}</p>`;
    let x=r.left+r.width/2-152,y=r.top-128;
    x=Math.max(12,Math.min(innerWidth-317,x)); if(y<12)y=r.bottom+12;
    tooltip.style.left=x+"px";tooltip.style.top=y+"px";tooltip.classList.add("show");
  };
  el.addEventListener("mouseenter",show);el.addEventListener("focus",show);
  el.addEventListener("mouseleave",()=>tooltip.classList.remove("show"));el.addEventListener("blur",()=>tooltip.classList.remove("show"));
});

// quiz
let current=0,answers=Array(12).fill(null);
const qtext=document.getElementById("qtext"),qnum=document.getElementById("qnum"),count=document.getElementById("count"),progressFill=document.getElementById("progressFill"),scale=document.getElementById("scale");
const prevBtn=document.getElementById("prevBtn"),nextBtn=document.getElementById("nextBtn"),resultBtn=document.getElementById("resultBtn");
function renderQ(){
  const q=QUESTIONS[current]; qtext.textContent=q.text; qnum.textContent=String(current+1).padStart(2,"0"); count.textContent=`${current+1} / 12`; progressFill.style.width=`${current/12*100}%`;
  scale.innerHTML="";
  for(let i=1;i<=5;i++){const b=document.createElement("button");b.textContent=i;if(answers[current]===i)b.classList.add("selected");b.onclick=()=>{answers[current]=i;renderQ()};scale.appendChild(b)}
  prevBtn.style.visibility=current===0?"hidden":"visible";nextBtn.style.display=current===11?"none":"inline-block";resultBtn.classList.toggle("show",current===11);
}
document.getElementById("startBtn").onclick=()=>{answers.fill(null);current=0;go("quiz");renderQ()};
document.getElementById("backHome").onclick=()=>go("home");
prevBtn.onclick=()=>{if(current>0){current--;renderQ()}};
nextBtn.onclick=()=>{if(answers[current]===null)return alert("응답을 선택해주세요.");current++;renderQ()};
resultBtn.onclick=()=>{
  if(answers.some(v=>v===null))return alert("모든 문항에 응답해주세요.");
  go("loading");
  setTimeout(()=>{buildResult();go("result");setTimeout(animateGauges,120)},1550);
};
document.getElementById("restartBtn").onclick=()=>{answers.fill(null);current=0;go("home")};

function level(vals){const n=vals.filter(v=>v>=4).length;return n===3?"강하게 해당":n===2?"해당":n===1?"일부 해당":"낮음"}
function buildResult(){
 const groups={plan:answers.slice(0,3),impulse:answers.slice(3,6),external:answers.slice(6,9),check:answers.slice(9,12)};
 const scores=Object.fromEntries(Object.entries(groups).map(([k,v])=>[k,v.reduce((a,b)=>a+b,0)]));
 const ranked=Object.keys(scores).sort((a,b)=>scores[b]-scores[a]);
 const primary=ranked[0],top=META[primary];
 document.getElementById("resultImg").src=top.img;document.getElementById("resultImg").alt=top.name;
 document.getElementById("resultTitle").textContent=`${top.name} · ${top.type}`;document.getElementById("resultDesc").textContent=top.result;
 document.getElementById("rxTitle").textContent=top.rx;document.getElementById("rxText").textContent=`우측의 ${top.type} 돈워리정을 수령해가세요.`;
 const gauges=document.getElementById("gauges");gauges.innerHTML="";
 ["plan","impulse","external","check"].forEach(k=>{
   const pct=scores[k]/15*100,row=document.createElement("div");
   row.innerHTML=`<div class="gauge-row"><div class="gauge-name">${META[k].type}</div><div class="track"><div class="fill" data-pct="${pct}" style="background:${META[k].color}"></div></div><div class="score">${scores[k]}/15</div><div class="level">${level(groups[k])}</div></div>`;
   gauges.appendChild(row);
 });
 const sec=document.getElementById("secondary");
 const secondary=ranked.slice(1).filter(k=>groups[k].filter(v=>v>=4).length>=2);
 if(secondary.length){sec.innerHTML=`<b>함께 높게 나타난 경향</b><br>${secondary.map(k=>META[k].type).join(" · ")}도 함께 확인해보세요.`;sec.classList.add("show")}else{sec.classList.remove("show")}
}
function animateGauges(){document.querySelectorAll(".fill").forEach((f,i)=>{f.style.width="0";setTimeout(()=>f.style.width=f.dataset.pct+"%",120+i*150)})}
</script>
</body>
